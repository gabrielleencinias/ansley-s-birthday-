#letter.open{transform:none}
.hit{position:absolute;cursor:pointer}
.hint{position:absolute;left:50%;transform:translateX(-50%) rotate(-1.5deg);background:linear-gradient(#fffaf0,#f6ead9);color:var(--ink);box-shadow:1px 3px 7px #0004;border-radius:3px 9px 4px 10px/10px 4px 9px 3px;padding:8px 18px;font:700 clamp(17px,5vw,22px) 'Caveat','Segoe Print','Bradley Hand',cursive;white-space:nowrap;animation:bob 2.4s infinite;z-index:5}
.hint::before{content:'';position:absolute;top:-10px;left:50%;width:48px;height:17px;background:repeating-linear-gradient(45deg,#f7a9c6cc 0 6px,#fff5 6px 12px);box-shadow:0 1px 2px #0002;transform:translateX(-50%) rotate(2deg)}
@keyframes bob{50%{transform:translate(-50%,-5px) rotate(-1.5deg)}}
.nav{position:absolute;bottom:10px;width:48px;height:48px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff9fbd,#e04a78);color:#fff;font:700 34px/40px 'Caveat','Segoe Print','Bradley Hand',cursive;padding:0 0 4px;cursor:pointer;z-index:9;box-shadow:0 3px 6px #0005,inset 0 0 0 2px #fff5;transition:transform .2s}
.nav::before{content:'';position:absolute;inset:5px;border-radius:50%;border:2px dashed #fffb}
#next{background:radial-gradient(circle at 35% 30%,#d8ec97,#86ac30)}
.nav:hover,.pill:hover{transform:scale(1.08) rotate(-4deg)}
#prev{left:10px}#next{right:10px}.nav[hidden]{display:none}
.flame{position:absolute;width:5.2%;height:6%;transform:translate(-50%,-100%);transform-origin:50% 100%;pointer-events:none;animation:fl .35s infinite alternate ease-in-out}
.flame::before,.flame::after{content:"";position:absolute;aspect-ratio:1;border-radius:0 50% 50% 50%;transform:rotate(-45deg);transform-origin:50% 50%}
.flame::before{left:14%;bottom:0;width:72%;background:#ff9f2e}
.flame::after{left:33%;bottom:6%;width:34%;background:#ffe76a}
@keyframes fl{from{transform:translate(-50%,-100%) scale(1,1)}to{transform:translate(-50%,-100%) scale(.92,1.08)}}
.flame.out{animation:none;opacity:0;transition:opacity .3s,transform .4s;transform:translate(-50%,-100%) scale(.2)}
.smoke{position:absolute;width:3%;height:7%;transform:translate(-50%,-100%);background:radial-gradient(#fffa,#fff0 70%);filter:blur(4px);opacity:0;pointer-events:none}
.smoke.go{animation:sm 2s ease-out}
@keyframes sm{0%{opacity:.8;transform:translate(-50%,-100%) scale(.5)}100%{opacity:0;transform:translate(-20%,-420%) scale(2)}}
#meter{position:absolute;left:12%;right:12%;bottom:64px;height:8px;border-radius:9px;background:#fff6;overflow:hidden;z-index:5}
#meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb347,#ff5a8a)}
#mic{position:absolute;left:50%;transform:translateX(-50%) rotate(1.5deg);bottom:12px;z-index:6;border:0;background:linear-gradient(#fffaf0,#f6ead9);color:var(--ink);box-shadow:1px 3px 7px #0004;border-radius:3px 9px 4px 10px/10px 4px 9px 3px;padding:10px 20px;font:700 clamp(18px,5.2vw,23px) 'Caveat','Segoe Print','Bradley Hand',cursive;cursor:pointer;outline:2px dashed #c2457a99;outline-offset:-5px;white-space:nowrap}
#mic::before{content:'';position:absolute;top:-10px;left:50%;width:48px;height:17px;background:repeating-linear-gradient(45deg,#f7a9c6cc 0 6px,#fff5 6px 12px);box-shadow:0 1px 2px #0002;transform:translateX(-50%) rotate(-3deg)}

#note.show{opacity:1}
.pill{position:absolute;z-index:9;border:0;background:linear-gradient(#fffaf0,#f6ead9);color:var(--ink);box-shadow:1px 3px 7px #0004;border-radius:3px 9px 4px 10px/10px 4px 9px 3px;padding:9px 20px;font:700 clamp(18px,5.2vw,23px) 'Caveat','Segoe Print','Bradley Hand',cursive;cursor:pointer;outline:2px dashed #c2457a99;outline-offset:-5px;transition:transform .2s}
.pill::before{content:'';position:absolute;top:-10px;left:50%;width:48px;height:17px;background:repeating-linear-gradient(45deg,#f7a9c6cc 0 6px,#fff5 6px 12px);box-shadow:0 1px 2px #0002;transform:translateX(-50%) rotate(-3deg)}

</style></head><body>
<div id="stage">
 <div class="pg" id="p1"><div class="hint" style="bottom:62px">tap to open your card 💌</div><div class="hit" style="inset:0" data-go="1"></div></div>
 <div class="pg right" id="p2">
  <div class="hit" id="env" style="left:9%;top:30%;width:52%;height:50%"></div>
  <div class="hint" style="bottom:62px" id="h2">tap the letter to open it</div>
  <div id="letter"></div>
 </div>
 <div class="pg right" id="p4">
  <div class="flame" id="f1" style="left:34.4%;top:47.3%"></div><div class="smoke" id="s1" style="left:34.4%;top:47.3%"></div>
  <div class="flame" id="f2" style="left:70%;top:47.6%"></div><div class="smoke" id="s2" style="left:70%;top:47.6%"></div>
  <div id="meter"><i></i></div>
  <button id="mic">🎤 Tap, then blow!</button>
 </div>
 <canvas id="cv"></canvas>
 <button class="pill" id="cakeBtn" hidden>🎂 Go to the cake</button><button class="pill" id="coverBtn" hidden>↺ Back to cover</button>
 <button class="nav" id="prev" hidden>‹</button><button class="nav" id="next" hidden>›</button>
</div>
<script>
const pgs=[p1,p2,p4];let cur=0,out=0,micOn=false,ctx,an,stream,loud=0;
function show(n){n=Math.max(0,Math.min(2,n));pgs.forEach((p,i)=>{p.classList.toggle('left',i<n);p.classList.toggle('right',i>n)});cur=n;
 prev.hidden=n==0;next.hidden=n==2;cakeBtn.hidden=n!=1;document.body.dataset.pg=n;coverBtn.hidden=n==0;if(n!=1)letter.classList.remove('open')}
cakeBtn.onclick=()=>show(2);coverBtn.onclick=()=>show(0);
prev.onclick=()=>show(cur-1);next.onclick=()=>show(cur+1);
document.querySelector('[data-go]').onclick=()=>show(1);
env.onclick=()=>{letter.classList.add('open');h2.style.opacity=0};
letter.onclick=()=>{letter.classList.remove('open')};
// swipe
let sx=null;stage.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
stage.addEventListener('touchend',e=>{if(sx==null||letter.classList.contains('open'))return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60)show(cur+(d<0?1:-1));sx=null});
function blow(i){const f=document.getElementById('f'+i);if(f.classList.contains('out'))return;f.classList.add('out');const s=document.getElementById('s'+i);s.classList.add('go');out++;
 if(out==2)setTimeout(party,500)}
function party(){stopMic();mic.style.display='none';meter.style.display='none';confetti()}
mic.onclick=async()=>{
 if(out>=2)return;
 if(micOn){blowAll();return}
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();const src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=1024;src.connect(an);micOn=true;
  mic.textContent='💨 Blow into your mic… (or tap to puff)';listen()}
 catch(e){mic.textContent='Mic unavailable — tap to blow 💨';micOn=true;mic.onclick=blowAll}
};
function blowAll(){blow(1);setTimeout(()=>blow(2),350)}
function listen(){if(!micOn||!an)return;const b=new Uint8Array(an.fftSize);an.getByteTimeDomainData(b);let s=0;for(const v of b){const x=(v-128)/128;s+=x*x}
 const rms=Math.sqrt(s/b.length);loud=rms>0.12?loud+1:Math.max(0,loud-2);meter.firstElementChild.style.width=Math.min(100,loud/22*100)+'%';
 if(loud>22){blow(1);if(loud>30)blow(2);if(loud>38){blow(1);blow(2)}}
 if(out<2)requestAnimationFrame(listen)}
function stopMic(){micOn=false;try{stream&&stream.getTracks().forEach(t=>t.stop());ctx&&ctx.close()}catch(e){}}
// confetti
function confetti(){const c=cv,g=c.getContext('2d');c.width=c.clientWidth;c.height=c.clientHeight;const cols=['#ff5a8a','#ffd1e0','#b7d46a','#fff3a0','#c2457a'];
 const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-Math.random()*c.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:4+Math.random()*5,a:Math.random()*6,c:cols[Math.random()*5|0]}));let t=0;
 (function f(){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore()});
  if(++t<400)requestAnimationFrame(f);else g.clearRect(0,0,c.width,c.height)})()}
show(0);
